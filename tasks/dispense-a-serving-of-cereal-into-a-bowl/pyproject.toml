[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-cereal-dispenser"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_cereal = "cereal_dispenser.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["cereal_dispenser*"]
