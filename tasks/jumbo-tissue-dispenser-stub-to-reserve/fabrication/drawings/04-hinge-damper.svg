<text x="45" y="57" font-family="sans-serif" font-size="26" fill="#111">04 | Real vertical pin hinge, edge reliefs and passive rotary damper</text>
<text x="45" y="86" font-family="sans-serif" font-size="16" fill="#111">P0 prototype fabrication | dimensions in mm | not to scale | datum O = world (368,-245,787.5) mm</text>
<line x1="170" y1="170" x2="170" y2="1011.4" stroke="#c33" stroke-width="2"/>
