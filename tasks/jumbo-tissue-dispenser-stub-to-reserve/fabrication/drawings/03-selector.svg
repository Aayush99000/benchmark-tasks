<text x="100" y="925" font-family="sans-serif" font-size="16" fill="#111">NEW BLUE KEEPERS: front X15..16.8; rear X127.2..129; Y8..482; Z-7..-4.2.</text>
<text x="100" y="950" font-family="sans-serif" font-size="16" fill="#111">They sit inside the original track envelope and below the thumbtab bridge; lateral gaps0.20+0.20.</text>
<text x="100" y="975" font-family="sans-serif" font-size="16" fill="#111">The original lower tracks support Z=-7; upper rim begins Z=-3. The3mm plate has1.0mm vertical play.</text>
<text x="100" y="1000" font-family="sans-serif" font-size="16" fill="#111">Bond keepers after fitting the plate. Bond one4mmY endstop last, so the plate can be inserted from the end.</text>
<text x="100" y="1025" font-family="sans-serif" font-size="16" fill="#111">Original10frame piece sizes/positions are every manual_frame.* row of cut-list.csv; no dimensions are inferred from this drawing.</text>
<text x="45" y="1120" font-family="sans-serif" font-size="16" fill="#111">General cut +/-0.10; cam, guide pins/slots and spring faces +/-0.05 unless stated. Ream fit holes after printing.</text>
<text x="45" y="1148" font-family="sans-serif" font-size="16" fill="#111">STLs share closed assembly coordinates. cut-list.csv and parts-mm.json are the complete coordinate/stock schedules.</text>
