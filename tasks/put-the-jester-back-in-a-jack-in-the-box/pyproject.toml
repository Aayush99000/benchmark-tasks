[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-jack-in-the-box"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_jack_in_box = "rdb_jack_in_box.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
jack_in_box_scripted = "rdb_jack_in_box.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
jack_in_box_score = "rdb_jack_in_box.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_jack_in_box*"]

[tool.setuptools.package-data]
rdb_jack_in_box = ["jack_in_box.usda"]
