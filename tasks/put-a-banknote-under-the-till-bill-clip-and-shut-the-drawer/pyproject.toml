[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-till-note"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_till_note = "rdb_till_note.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
till_note_scripted = "rdb_till_note.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
till_note_score = "rdb_till_note.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_till_note*"]

[tool.setuptools.package-data]
rdb_till_note = ["till.usda"]
