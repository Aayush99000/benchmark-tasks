<text x="454.6" y="961.4" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="end" font-weight="normal" fill="#555">far side</text>
<text x="560.0" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">Parts</text>
<text x="560.0" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">1  Pillow-block bearing, 8 bore, two; c is its centre height (15 for the KP08 size)</text>
<text x="560.0" y="580.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">2  Steel shaft, 8 dia, 70 long, a flat filed under each set screw</text>
<text x="560.0" y="598.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">3  Rigid flange coupling, 8 bore; one set screw replaced by an M4 x 16 screw: the stop pin</text>
<text x="560.0" y="616.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">4  Shaft collar, 8 bore; its set screw replaced by an M4 x 16 screw: the spring's pin</text>
<text x="560.0" y="634.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">5  Torsion spring round the shaft (below)</text>
<text x="560.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">6  Stop post: M5 x 40 screw in the riser's top, in a rubber sleeve</text>
<text x="560.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">7  Adapter disc: 9 plywood, 56 dia, bolted to the flange, screwed to the arm's elbow end</text>
<text x="560.0" y="688.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">8  Riser: hardwood or aluminium, 70 x 65, 108 - c high, bolted to the table</text>
<text x="560.0" y="706.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">9  Cover (optional): thin sheet box 70 x 76 x 148 over the riser, open to the hand</text>
<text x="560.0" y="750.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">C. The spring and the check</text>
<text x="560.0" y="772.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">Round music wire 1.0 dia; mean coil dia 12 (11 inside, 13 outside); 7.75 turns;</text>
<text x="560.0" y="789.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">two straight legs of 25.</text>
<text x="560.0" y="806.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">Rate = E d^4 / (64 D n) = 206000 x 1^4 / (64 x 12 x 7.75) = 34.6 N mm/rad (task: 35.0).</text>
<text x="560.0" y="823.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">One leg bears on the collar's pin (4), the other on an M4 screw in the riser's top.</text>
<text x="560.0" y="840.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">Turn the collar on the shaft until both legs just touch with the arm palm down; tighten.</text>
<text x="560.0" y="857.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">Check: a spring scale hooked at the hand's edge, 40 from the axis, reads 1.4 N</text>
<text x="560.0" y="874.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111">(1.2 to 1.6 N passes) holding the arm a quarter turn over. Let go, it returns to the post.</text>
</svg>
